defects:
  - id: "DEF-001"
    subsystem: "internal/statemachine"
    category: "Incorrect state transitions"
    mechanism: "Transition to SUCCEEDED allowed directly from PAUSED without passing through RUNNING"
    detection: "table-driven unit tests + property-based invariant tests on the state machine"
    fix: "Disallow PAUSED -> SUCCEEDED transition in StateMachine.allow matrix"
    independence_check: "Isolated to state transition table definition between paused and completed"

  - id: "DEF-002"
    subsystem: "internal/statemachine"
    category: "Incorrect state transitions"
    mechanism: "CANCELLED state allows subsequent transition to FAILED when late step error returns"
    detection: "table-driven unit tests + property-based invariant tests on the state machine"
    fix: "Enforce terminal state immutability in StateMachine.Transition"
    independence_check: "Isolated to terminal state transition guard logic"

  - id: "DEF-003"
    subsystem: "internal/statemachine"
    category: "Incorrect state transitions"
    mechanism: "Workflow transition to WAITING_RETRY fails to reset active step execution counters"
    detection: "state machine step counter integration test"
    fix: "Reset active step counter when moving to retry state"
    independence_check: "Isolated to retry step counter tracking"

  - id: "DEF-004"
    subsystem: "internal/scheduler"
    category: "Concurrency/race conditions"
    mechanism: "Unsynchronized read of activeWorkers atomic counter during worker pool resize"
    detection: "go test -race ./..."
    fix: "Use atomic.LoadInt32 instead of raw struct field read"
    independence_check: "Data race in worker pool resize routine"

  - id: "DEF-005"
    subsystem: "internal/scheduler"
    category: "Concurrency/race conditions"
    mechanism: "Double unlock of sync.RWMutex on task dispatch queue under error path"
    detection: "go test -race ./..."
    fix: "Remove redundant mu.RUnlock in error return branch"
    independence_check: "Mutex double-unlock on priority queue drain"

  - id: "DEF-006"
    subsystem: "internal/persistence/memstore"
    category: "Concurrency/race conditions"
    mechanism: "Range loop over shared map without holding read lock during list query"
    detection: "go test -race ./..."
    fix: "Acquire s.mu.RLock() before iterating over definitions map"
    independence_check: "Unprotected iteration over memstore map during read query"

  - id: "DEF-007"
    subsystem: "internal/webhook"
    category: "Concurrency/race conditions"
    mechanism: "Data race on delivererCount when scaling webhook workers dynamically"
    detection: "go test -race ./..."
    fix: "Protect delivererCount with atomic or mutex during scale"
    independence_check: "Race on worker count during dynamic dispatcher scaling"

  - id: "DEF-008"
    subsystem: "internal/persistence/pgstore"
    category: "Resource-management problems"
    mechanism: "database/sql.Rows not closed on early break in run pagination scanner"
    detection: "goleak in TestMain; explicit close-path tests"
    fix: "Add defer rows.Close() immediately after db.QueryContext"
    independence_check: "Unclosed SQL rows iterator leak on pagination break"

  - id: "DEF-009"
    subsystem: "internal/plugin/handlers"
    category: "Resource-management problems"
    mechanism: "Unclosed http.Response.Body on non-200 status codes in HttpTaskHandler"
    detection: "goleak in TestMain; explicit close-path tests"
    fix: "Ensure resp.Body.Close() is called on all return paths including non-200 errors"
    independence_check: "HTTP body descriptor leak in outbound plugin handler"

  - id: "DEF-010"
    subsystem: "internal/cli"
    category: "Resource-management problems"
    mechanism: "Temporary config file descriptor leaked when parsing invalid YAML input"
    detection: "explicit file descriptor count test"
    fix: "Wrap os.Open in defer f.Close() before decoding configuration"
    independence_check: "File descriptor leak in CLI configuration reader"

  - id: "DEF-011"
    subsystem: "internal/cache"
    category: "Stale-cache behavior"
    mechanism: "Workflow definition cache key omits namespace prefix, cross-pollinating tenants"
    detection: "integration tests exercising the specific invalidation path"
    fix: "Prefix cache key with fmt.Sprintf('%s:%s:%d', namespace, name, version)"
    independence_check: "Cache key multi-tenancy partition collision"

  - id: "DEF-012"
    subsystem: "internal/cache"
    category: "Stale-cache behavior"
    mechanism: "Cache invalidation hook triggered before DB transaction commits; rollback re-caches stale data"
    detection: "integration tests exercising the specific invalidation path"
    fix: "Move cache eviction callback to post-commit phase"
    independence_check: "Premature cache invalidation ordering during rollback"

  - id: "DEF-013"
    subsystem: "internal/retry"
    category: "Boundary-condition errors"
    mechanism: "Off-by-one in retry loop: executes maxRetries + 1 attempts before halting"
    detection: "table-driven tests at the boundary + fuzzing"
    fix: "Change attempt <= maxRetries to attempt < maxRetries in loop condition"
    independence_check: "Loop boundary off-by-one on retry limit"

  - id: "DEF-014"
    subsystem: "internal/backoff"
    category: "Boundary-condition errors"
    mechanism: "Integer overflow when computing exponential backoff duration for large attempt values (>32)"
    detection: "table-driven tests at the boundary + fuzzing"
    fix: "Cap attempt count at 30 before bit shift to prevent duration overflow"
    independence_check: "Integer bit-shift overflow on backoff calculation"

  - id: "DEF-015"
    subsystem: "internal/api"
    category: "Boundary-condition errors"
    mechanism: "Pagination limit of 0 returns all records instead of clamping to default minimum"
    detection: "negative-case API/boundary tests"
    fix: "Clamp limit <= 0 to defaultPageSize (20)"
    independence_check: "API pagination query parameter zero-handling bug"

  - id: "DEF-016"
    subsystem: "internal/workflow"
    category: "Incorrect error propagation"
    mechanism: "Underlying store ErrRunNotFound swallowed and re-wrapped as generic internal server error"
    detection: "errors.Is/errors.As tests, error-wrapping audit"
    fix: "Wrap error using fmt.Errorf('%w: %v', ErrNotFound, err)"
    independence_check: "Error masking in workflow step lookup"

  - id: "DEF-017"
    subsystem: "internal/persistence/pgstore"
    category: "Incorrect error propagation"
    mechanism: "DB transaction rollback error shadows the primary execution failure error"
    detection: "errors.Is/errors.As tests, error-wrapping audit"
    fix: "Preserve original error and join with rollback error using errors.Join"
    independence_check: "Transaction rollback error shadow in pgstore"

  - id: "DEF-018"
    subsystem: "internal/api/v1"
    category: "Serialization/deserialization inconsistencies"
    mechanism: "JSON serialization of StepRun.CreatedAt omits timezone offset (RFC3339 vs UTC)"
    detection: "round-trip property tests"
    fix: "Explicitly serialize time using time.RFC3339Nano in custom JSON marshaler"
    independence_check: "Timestamp timezone omission in REST DTO serialization"

  - id: "DEF-019"
    subsystem: "internal/events"
    category: "Serialization/deserialization inconsistencies"
    mechanism: "Protobuf event serialization drops custom metadata key-value map with integer keys"
    detection: "round-trip property tests"
    fix: "Coerce integer keys to string representation before protobuf pack"
    independence_check: "Protobuf map type coercion drop"

  - id: "DEF-020"
    subsystem: "internal/config"
    category: "Serialization/deserialization inconsistencies"
    mechanism: "Durations formatted as integers in JSON config parsed as nanoseconds instead of seconds"
    detection: "round-trip property tests"
    fix: "Parse numeric duration config by multiplying with time.Second"
    independence_check: "Duration unit mismatch in JSON loader"

  - id: "DEF-021"
    subsystem: "internal/scheduler"
    category: "Lifecycle bugs"
    mechanism: "Worker pool Shutdown() hangs indefinitely when queue contains unconsumed tasks"
    detection: "integration tests around startup/shutdown/cancellation"
    fix: "Drain and discard pending task queue before waiting on worker waitgroup"
    independence_check: "Graceful shutdown deadlock on unconsumed queue items"

  - id: "DEF-022"
    subsystem: "internal/worker"
    category: "Lifecycle bugs"
    mechanism: "Maintenance reaper ticker channel not stopped on context cancellation, leaking goroutine"
    detection: "goleak in TestMain; lifecycle cancel test"
    fix: "Call ticker.Stop() and return from select loop on ctx.Done()"
    independence_check: "Goroutine leak on background ticker cancellation"

  - id: "DEF-023"
    subsystem: "internal/webhook"
    category: "Lifecycle bugs"
    mechanism: "Webhook deliverer exits immediately on single delivery failure instead of continuing pool"
    detection: "integration tests around startup/shutdown/cancellation"
    fix: "Log delivery error and continue worker loop instead of returning early"
    independence_check: "Premature worker exit on individual delivery error"

  - id: "DEF-024"
    subsystem: "internal/config"
    category: "Configuration mistakes"
    mechanism: "Environment variable TEMPEST_STORE_TIMEOUT ignored when config file sets store.timeout"
    detection: "precedence tests across env/file/flag combinations"
    fix: "Evaluate env vars after file configuration in config loader hierarchy"
    independence_check: "Precedence inverted between environment variable and config file"

  - id: "DEF-025"
    subsystem: "internal/config"
    category: "Configuration mistakes"
    mechanism: "CLI --port flag defaults override non-empty config file port settings"
    detection: "precedence tests across env/file/flag combinations"
    fix: "Only apply CLI flag value if flag was explicitly visited by flag.CommandLine"
    independence_check: "Default flag value trampling file configuration"

  - id: "DEF-026"
    subsystem: "pkg/validation"
    category: "Validation gaps"
    mechanism: "Workflow DAG parser allows self-referencing step dependency (step.depends_on = [step.id])"
    detection: "negative-case API/boundary tests"
    fix: "Add validation check rejecting any step depending on itself"
    independence_check: "Missing self-referencing check in DAG validation rule"

  - id: "DEF-027"
    subsystem: "internal/api"
    category: "Validation gaps"
    mechanism: "Workflow submit endpoint accepts negative timeout duration ('timeout': '-5s')"
    detection: "negative-case API/boundary tests"
    fix: "Validate timeout duration > 0 in request payload validator"
    independence_check: "Missing validation for negative duration in API submit"

  - id: "DEF-028"
    subsystem: "internal/auth"
    category: "Validation gaps"
    mechanism: "Bearer token parser accepts empty token string when Authorization header is 'Bearer '"
    detection: "negative-case API/boundary tests"
    fix: "Reject empty token string after strings.TrimPrefix"
    independence_check: "Empty bearer token accepted in auth middleware"

  - id: "DEF-029"
    subsystem: "internal/scheduler"
    category: "Memory/resource leaks"
    mechanism: "Lease heartbeat map retains expired run IDs indefinitely without eviction"
    detection: "goleak, and a pprof heap snapshot comparison in CI"
    fix: "Delete entry from heartbeat map when run reaches terminal state"
    independence_check: "Unbounded map growth in lease renewal tracker"

  - id: "DEF-030"
    subsystem: "internal/events"
    category: "Memory/resource leaks"
    mechanism: "EventBus channel buffer blocks and leaks goroutines when subscriber unsubscribes"
    detection: "goleak in TestMain"
    fix: "Close channel and remove subscriber listener under mutex on Unsubscribe"
    independence_check: "Leaked subscriber channel goroutines on event bus"

  - id: "DEF-031"
    subsystem: "internal/dashboard"
    category: "Memory/resource leaks"
    mechanism: "Historical runs slice in dashboard handler grows unbounded on continuous refresh"
    detection: "pprof heap snapshot comparison in CI for long-running paths"
    fix: "Cap dashboard historical runs slice to last 100 items"
    independence_check: "Unbounded slice retention in status dashboard handler"

  - id: "DEF-032"
    subsystem: "internal/auth"
    category: "Type-safety mistakes"
    mechanism: "Unchecked type assertion from context.Value('principal') panics on unauthenticated route"
    detection: "go vet, staticcheck, unchecked type assertions caught by targeted test"
    fix: "Use comma-ok type assertion: p, ok := ctx.Value(principalKey).(*Principal)"
    independence_check: "Unchecked context value type assertion in auth helper"

  - id: "DEF-033"
    subsystem: "internal/plugin"
    category: "Type-safety mistakes"
    mechanism: "Unchecked interface cast of task handler output payload panics on string output"
    detection: "go vet, staticcheck, unchecked type assertions caught by targeted test"
    fix: "Validate payload type via type switch before processing"
    independence_check: "Unsafe type assertion on plugin execution payload"

  - id: "DEF-034"
    subsystem: "internal/dashboard"
    category: "Validation gaps"
    mechanism: "Unescaped step error message rendered in HTML dashboard allows XSS injection"
    detection: "negative-case API/boundary tests"
    fix: "Use html/template automatic escaping rather than raw bytes injection"
    independence_check: "HTML template XSS sanitization gap in status dashboard"

  - id: "DEF-035"
    subsystem: "internal/retry"
    category: "Concurrency/race conditions"
    mechanism: "Race condition on retry attempt counter shared across concurrent sub-step executions"
    detection: "go test -race ./..."
    fix: "Isolate attempt counters per step execution context rather than shared policy"
    independence_check: "Shared counter race across concurrent sub-steps"

  - id: "DEF-036"
    subsystem: "internal/persistence/pgstore"
    category: "Incorrect state transitions"
    mechanism: "Lease acquisition succeeds even when lease has not expired due to missing < NOW() check"
    detection: "table-driven unit tests on lease stealing"
    fix: "Add AND expires_at < NOW() condition to lease steal SQL query"
    independence_check: "Missing expiration timestamp check in SQL lease steal statement"
